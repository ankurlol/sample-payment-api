name: Deploy Service & Auto-Rollback

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Git Commit SHA to rollback and deploy"
        required: true
        default: ""
      reason:
        description: "Reason for rollback"
        required: false
        default: "Autonomous SRE Rollback"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Commit SHA
        id: target
        run: |
          if [ -n "${{ github.event.inputs.rollback_sha }}" ]; then
            echo "TARGET_SHA=${{ github.event.inputs.rollback_sha }}" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=ROLLBACK" >> $GITHUB_OUTPUT
            echo "Reason: ${{ github.event.inputs.reason }}"
          else
            echo "TARGET_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "DEPLOY_TYPE=STANDARD_DEPLOY" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.TARGET_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Simulated Deployment & Health Verification
        run: |
          echo "=========================================="
          echo "🚀 Deploying target commit: ${{ steps.target.outputs.TARGET_SHA }}"
          echo "📦 Deployment Type: ${{ steps.target.outputs.DEPLOY_TYPE }}"
          echo "=========================================="
          
          # Start app in background unbuffered
          python -u app.py > app.log 2>&1 &
          PID=$!
          
          echo "Waiting for service to bind port 3000..."
          for i in {1..10}; do
            if curl -s http://127.0.0.1:3000/healthz > /dev/null; then
              echo "✅ Health check PASSED (HTTP 200). Service healthy!"
              cat app.log
              kill $PID
              exit 0
            fi
            echo "Attempt $i: waiting for service..."
            sleep 1
          done
          
          echo "❌ Health check failed to respond in time. Application logs:"
          cat app.log
          kill $PID
          exit 1
